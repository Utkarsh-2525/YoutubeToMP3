server.port=${PORT:8080}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.application.name=youtube-mp3-backend

# Windows defaults. Override these with environment variables if required.
app.tools.yt-dlp=${YT_DLP_PATH:tools/yt-dlp.exe}
app.tools.ffmpeg=${FFMPEG_PATH:tools/ffmpeg.exe}
app.download-dir=${DOWNLOAD_DIR:downloads}

# Keep individual downloads bounded.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
